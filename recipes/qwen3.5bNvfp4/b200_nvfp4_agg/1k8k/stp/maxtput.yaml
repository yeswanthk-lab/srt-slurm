name: "qwen3.5-b200-nvfp4-1k8k-maxtput"

model:
  path: "qwen3.5-397B"
  container: "sglang-latest"
  precision: "nvfp4"

resources:
  gpu_type: "b200"
  agg_nodes: 1
  agg_workers: 1
  gpus_per_node: 8

backend:
  aggregated_environment:
    NCCL_NVLS_ENABLE: "1"
    SGL_ENABLE_JIT_DEEPGEMM: "false"
    SGLANG_ENABLE_FLASHINFER_GEMM: "true"
    PYTHONUNBUFFERED: "1"

  sglang_config:
    aggregated:
      served-model-name: "Qwen/Qwen3.5-397B-A17B-NVFP4"
      trust-remote-code: true
      quantization: modelopt_fp4

      tp-size: 8

      attention-backend: "trtllm_mha"
      moe-runner-backend: "flashinfer_trtllm"

      disable-radix-cache: true
      kv-cache-dtype: "fp8_e4m3"
      enable-symm-mem: true

      mem-fraction-static: 0.85
      chunked-prefill-size: 32768
      max-prefill-tokens: 32768
      cuda-graph-max-bs: 256
      max-running-requests: 256
      context-length: 9236

      stream-interval: 30
      scheduler-recv-interval: 20
      enable-flashinfer-allreduce-fusion: true

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 8192
  concurrencies: "4x8x16x32x64x128x256"
  req_rate: "inf"

health_check:
  max_attempts: 360
  interval_seconds: 10
